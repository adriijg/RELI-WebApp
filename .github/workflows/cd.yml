name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  IMAGE_BACKEND: reli-backend
  IMAGE_FRONTEND: reli-frontend

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_BACKEND }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api-backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_FRONTEND }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./reli-frontend
          file: ./reli-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=/api
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SUPABASE_BUCKET=${{ secrets.VITE_SUPABASE_BUCKET }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Se ejecuta en el runner self-hosted instalado en el propio NAS
  # (ver nas-deploy/docker-compose.runner.yml). Al estar dentro de la LAN,
  # alcanza el Docker del NAS directamente y no necesita SSH ni puertos abiertos.
  deploy:
    name: Deploy on NAS
    needs: build-push
    runs-on: [self-hosted, nas]
    environment: production
    steps:
      # Nota: sin actions/checkout a proposito. El kernel del NAS (DSM 6.1,
      # Linux 3.10) no soporta getrandom(), y el git del checkout falla. El
      # compose se descarga por HTTPS mas abajo.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Ensure docker compose plugin
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose version
            exit 0
          fi
          ARCH=$(uname -m)
          case "$ARCH" in
            aarch64|arm64) ARCH=aarch64 ;;
            x86_64|amd64)  ARCH=x86_64 ;;
          esac
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${ARCH}" \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version

      - name: Stop legacy containers
        run: |
          for c in backend reli-webapp-frontend1; do
            if docker inspect "$c" >/dev/null 2>&1; then
              img=$(docker inspect -f '{{.Config.Image}}' "$c")
              case "$img" in reli-webapp-*) echo "Eliminando contenedor legacy: $c ($img)"; docker rm -f "$c" ;; esac
            fi
          done

      - name: Pull & up on NAS
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/volume1/docker/reli-app' }}
          IMAGE_REGISTRY: ${{ vars.DEPLOY_IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
          IMAGE_TAG: latest
          COMPOSE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.nas.yml
        run: |
          set -e
          mkdir -p "$DEPLOY_PATH"
          curl -fsSL "$COMPOSE_URL" -o "$DEPLOY_PATH/docker-compose.yml"
          cd "$DEPLOY_PATH"
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
