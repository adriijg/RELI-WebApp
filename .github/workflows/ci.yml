name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reli-frontend
    env:
      # Valores dummy: el build de Vite solo necesita que existan las claves.
      VITE_API_URL: /api
      VITE_GOOGLE_CLIENT_ID: ci-dummy.apps.googleusercontent.com
      VITE_SUPABASE_URL: https://ci-dummy.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-dummy-anon-key
      VITE_SUPABASE_BUCKET: images
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: reli-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
