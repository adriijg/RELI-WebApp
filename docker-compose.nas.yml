# Compose de PRODUCCION para el NAS Synology.
#
# Lo usa el workflow .github/workflows/cd.yml: lo copia al NAS como
# docker-compose.yml y ejecuta "docker compose pull && docker compose up -d".
# Usa las imagenes publicadas tanto en GHCR como en Docker Hub.
#
# En la carpeta de despliegue del NAS solo hacen falta:
#   - docker-compose.yml  (este fichero; lo copia el CD automaticamente)
#   - .env                (tus secretos reales, ver api-backend/.env.example)
#
# Registry y tag se inyectan por entorno desde el CD (por defecto GHCR latest):
#   IMAGE_REGISTRY=ghcr.io/adriijg   IMAGE_TAG=latest
# Si las imagenes de GHCR son privadas, haz login una vez en el NAS:
#   echo <PAT_con_read:packages> | docker login ghcr.io -u <usuario> --password-stdin
#
# Puertos: el frontend escucha en el 8081 del NAS (el 80 lo usa el propio DSM).
# Expuesto con el Reverse Proxy de DSM en http://reallisiados.duckdns.org

services:
  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/adriijg}/reli-backend:${IMAGE_TAG:-latest}
    # Sin puerto en el host: el frontend llama al backend por la red interna
    # (http://backend:8080). El 8080 del host lo ocupa otra app (admana-web).
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    env_file:
      - ./.env
    # El backend tarda ~50s en arrancar (conecta a Supabase Postgres).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/players?size=1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/adriijg}/reli-frontend:${IMAGE_TAG:-latest}
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
