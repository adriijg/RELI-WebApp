limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    limit_req_status 429;

    # El NAS/DSM actua como proxy inverso: recuperamos la IP real del cliente.
    set_real_ip_from 127.0.0.1/32;
    set_real_ip_from ::1/128;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://*.google.com https://*.gstatic.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://*.google.com https://*.gstatic.com; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src https://accounts.google.com https://*.google.com; manifest-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Assets con hash de contenido (index-XXXX.js, etc.): cachear de forma agresiva.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html: revalidar siempre para no servir bundles obsoletos.
    location = /index.html {
        expires -1;
    }

    # Imagenes y fuentes del directorio public: cache corta.
    location ~* \.(?:png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Endpoints sensibles: limite por IP para frenar fuerza bruta y spam.
    location ~ ^/api/(users/(login|register|password-reset/(request|confirm)|verify-email/resend)|auth/google|contact)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
