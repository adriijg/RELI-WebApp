spring.config.import=optional:file:api-backend/.env[.properties],optional:file:.env[.properties],optional:file:./api-backend/.env[.properties]
# 1. Pooler de Supabase (IPv4 funciona; el host directo solo resuelve IPv6 y falla desde esta mÃ¡quina)
spring.datasource.url=jdbc:postgresql://aws-1-eu-west-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0

# 2. Usuario del pooler (postgres.<project-ref>)
spring.datasource.username=postgres.pjefzhrnoftaovlvnjaz

# 3. La contrasena de tu variable de entorno (no hardcodear)
spring.datasource.password=${DB_PASSWORD:}

# --- Ajustes extra para que no falle con el Pooler ---
# Forzamos a que no use sentencias preparadas (vital en modo Transaction)
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Evitamos que Hikari mantenga conexiones viejas que el Pooler pueda haber cerrado
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=30000

# Ajustes JPA/Hibernate
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Bootstrap del admin
app.bootstrap-admin.enabled=true
app.bootstrap-admin.username=${ADMIN_USERNAME:admin}
app.bootstrap-admin.email=${ADMIN_EMAIL:admin@example.com}
app.bootstrap-admin.password=${ADMIN_PASSWORD:Admin1234}

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
# Minimo 32 bytes para HS256. En produccion definir via variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET:reli-webapp-jwt-secret-key-0123456789abcdef}
# 24 horas
app.jwt.expiration=86400000

# Federacion (FFM / Novanet): scraping de calendario y resultados
app.ffm.base-url=https://parla.ffmadrid.es
app.ffm.user=${FFM_USER:}
app.ffm.password=${FFM_PASS:}
app.ffm.cod-primaria=1000128
app.ffm.cod-agrupacion=1
app.ffm.tipo-juego=3
# Programada (lunes y jueves 08:00). Apagada por defecto hasta tener hosting fijo.
app.ffm.sync-schedule-enabled=false
app.ffm.sync-cron=0 0 8 * * MON,THU

# Resend
app.email.enabled=${EMAIL_ENABLED:false}
app.email.api-key=${RESEND_API_KEY:}
app.email.from=${RESEND_FROM:no-reply@example.com}
app.email.frontend-url=${FRONTEND_URL:http://localhost:5173/auth}
